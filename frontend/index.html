<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Simple Calculator</title>
	<style>
		:root {
			color-scheme: light;
			--ink: #19231f;
			--muted: #708078;
			--paper: #f6f3eb;
			--panel: #fffdf8;
			--line: #d9ded5;
			--accent: #e06d4f;
			--accent-dark: #bd4d32;
			--soft: #eaf0e8;
		}

		* { box-sizing: border-box; }

		body {
			min-height: 100vh;
			margin: 0;
			display: grid;
			place-items: center;
			padding: 24px;
			color: var(--ink);
			background: radial-gradient(circle at 15% 15%, #fff7d7 0 18%, transparent 42%),
				linear-gradient(135deg, #f5efe4, #dce9e0);
			font-family: Georgia, "Times New Roman", serif;
		}

		.calculator {
			width: min(100%, 390px);
			padding: 24px;
			border: 1px solid rgba(25, 35, 31, 0.12);
			border-radius: 18px;
			background: rgba(255, 253, 248, 0.92);
			box-shadow: 0 22px 55px rgba(48, 64, 54, 0.16);
		}

		.eyebrow {
			margin: 0 0 6px;
			color: var(--accent-dark);
			font: 700 0.72rem/1.2 Arial, sans-serif;
			letter-spacing: 0.12em;
			text-transform: uppercase;
		}

		h1 { margin: 0 0 18px; font-size: clamp(2rem, 8vw, 2.7rem); }

		.display {
			min-height: 94px;
			display: flex;
			align-items: end;
			justify-content: end;
			overflow: hidden;
			padding: 18px;
			border: 1px solid var(--line);
			border-radius: 12px;
			background: var(--paper);
			font: 700 clamp(2rem, 10vw, 3.2rem)/1 Arial, sans-serif;
			word-break: break-all;
		}

		.keys {
			display: grid;
			grid-template-columns: repeat(4, 1fr);
			gap: 10px;
			margin-top: 14px;
		}

		button {
			min-height: 58px;
			border: 1px solid var(--line);
			border-radius: 10px;
			color: var(--ink);
			background: var(--panel);
			font: 700 1.15rem Arial, sans-serif;
			cursor: pointer;
			transition: transform 120ms ease, background 120ms ease;
		}

		button:hover { background: var(--soft); }
		button:active { transform: translateY(2px); }
		button:focus-visible { outline: 3px solid #efb23d; outline-offset: 2px; }
		.operator { color: var(--accent-dark); background: #fff4e9; }
		.utility { color: var(--muted); background: var(--soft); }
		.equals { color: #fff; border-color: var(--accent); background: var(--accent); }
		.equals:hover { background: var(--accent-dark); }
		.span-two { grid-column: span 2; }

		@media (max-width: 380px) {
			body { padding: 12px; }
			.calculator { padding: 18px; }
			button { min-height: 52px; }
		}
	</style>
</head>
<body>
	<main class="calculator" aria-label="Simple calculator">
		<p class="eyebrow">Workshop tool</p>
		<h1>Calculator</h1>
		<output class="display" id="display" aria-live="polite">0</output>

		<section class="keys" aria-label="Calculator buttons">
			<button class="utility" type="button" data-action="clear">AC</button>
			<button class="utility" type="button" data-action="backspace" aria-label="Backspace">&#9003;</button>
			<button class="operator" type="button" data-value="%">%</button>
			<button class="operator" type="button" data-value="/">&#247;</button>
			<button type="button" data-value="7">7</button>
			<button type="button" data-value="8">8</button>
			<button type="button" data-value="9">9</button>
			<button class="operator" type="button" data-value="*">&#215;</button>
			<button type="button" data-value="4">4</button>
			<button type="button" data-value="5">5</button>
			<button type="button" data-value="6">6</button>
			<button class="operator" type="button" data-value="-">&#8722;</button>
			<button type="button" data-value="1">1</button>
			<button type="button" data-value="2">2</button>
			<button type="button" data-value="3">3</button>
			<button class="operator" type="button" data-value="+">+</button>
			<button class="span-two" type="button" data-value="0">0</button>
			<button type="button" data-value=".">.</button>
			<button class="equals" type="button" data-action="equals">=</button>
		</section>
	</main>

	<script>
		const display = document.querySelector('#display');
		let expression = '';
		let justCalculated = false;

		function render() {
			display.textContent = expression || '0';
		}

		function addValue(value) {
			if (justCalculated && /[0-9.]/.test(value)) expression = '';
			justCalculated = false;
			expression += value;
			render();
		}

		function calculate() {
			if (!expression || !/[0-9]$/.test(expression)) return;
			try {
				const result = Function(`"use strict"; return (${expression})`)();
				if (!Number.isFinite(result)) throw new Error('Invalid result');
				expression = String(Math.round((result + Number.EPSILON) * 1e12) / 1e12);
				justCalculated = true;
				render();
			} catch {
				expression = '';
				display.textContent = 'Error';
			}
		}

		document.querySelector('.keys').addEventListener('click', (event) => {
			const button = event.target.closest('button');
			if (!button) return;
			const { action } = button.dataset;
			if (action === 'clear') { expression = ''; justCalculated = false; render(); }
			else if (action === 'backspace') { expression = expression.slice(0, -1); render(); }
			else if (action === 'equals') calculate();
			else addValue(button.dataset.value);
		});

		document.addEventListener('keydown', (event) => {
			if (/^[0-9+\-*/.%]$/.test(event.key)) addValue(event.key);
			else if (event.key === 'Enter' || event.key === '=') calculate();
			else if (event.key === 'Backspace') { expression = expression.slice(0, -1); render(); }
			else if (event.key === 'Escape') { expression = ''; justCalculated = false; render(); }
		});
	</script>
</body>
</html>
